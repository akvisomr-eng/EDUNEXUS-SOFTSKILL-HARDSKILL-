name: EDUNEXUS CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DATABASE.md
          test -f docs/API.md
          test -f supabase/migrations/0001_initial_foundation.sql
          test -f supabase/migrations/0002_rls_policy_design.sql
          test -f supabase/migrations/0003_identity_membership_rls_baseline.sql
          grep -q "alter table public.profiles enable row level security" supabase/migrations/0003_identity_membership_rls_baseline.sql
          grep -q "institution_memberships" supabase/migrations/0003_identity_membership_rls_baseline.sql
          grep -q "guardian_student_relationships" supabase/migrations/0003_identity_membership_rls_baseline.sql
          grep -q "mentor_student_relationships" supabase/migrations/0003_identity_membership_rls_baseline.sql
          grep -q "profiles_insert_own" supabase/migrations/0003_identity_membership_rls_baseline.sql
          echo "EDUNEXUS foundation and security baseline files present"
