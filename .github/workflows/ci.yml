name: EDUNEXUS CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository foundation
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DATABASE.md
          test -f docs/API.md
          test -f neon/migrations/0001_auth_identity_compat.sql
          test -f neon/migrations/0002_trusted_practice_rpc.sql
          test -f neon/migrations/0003_ensure_my_profile.sql
          test -f neon/tests/0001_auth_identity_compat.sql
          test -f neon/tests/0002_trusted_practice_rpc.sql
          test -f neon/tests/0003_ensure_my_profile.sql
          test -f docs/NEON_CUTOVER.md
          test -f web/neon-cutover-smoke.html
          test -f tests/neon-browser-smoke.mjs
          test -f tests/neon-frontend-e2e.mjs
          grep -q "NEON_AUTH_URL" web/index.html
          grep -q "DATA_API_URL" web/index.html
          grep -q "ensure_my_profile" web/index.html
          grep -q "finalize_my_practice_attempt" web/index.html
          ! grep -q "SUPABASE_URL" web/index.html
          grep -q "neon-preview.html" .github/workflows/neon-browser-smoke.yml
          test -f .github/workflows/neon-browser-smoke.yml
          grep -q "playwright" .github/workflows/neon-browser-smoke.yml
          grep -q "JWT nyata dari Neon Auth" tests/neon-browser-smoke.mjs
          grep -q "@neondatabase/auth" web/neon-cutover-smoke.html
          grep -q "getSession()" web/neon-cutover-smoke.html
          grep -q "data?.session?.token" web/neon-cutover-smoke.html
          grep -q "rpc/current_user_id" web/neon-cutover-smoke.html
          grep -q "rpc/ensure_my_profile" web/neon-cutover-smoke.html
          grep -q "ensure_my_profile" neon/migrations/0003_ensure_my_profile.sql
          grep -q "Bukti praktik sebagai kandidat" tests/neon-browser-smoke.mjs
          grep -q "Uji isolasi lintas akun" web/neon-cutover-smoke.html
          grep -q "current_user_id" neon/migrations/0001_auth_identity_compat.sql
          grep -q "supabase_identity_migration" neon/migrations/0001_auth_identity_compat.sql
          grep -q "SECURITY DEFINER" neon/migrations/0002_trusted_practice_rpc.sql
          grep -q "finalize_my_practice_attempt" neon/tests/0002_trusted_practice_rpc.sql
          grep -q "41 public tables" docs/NEON_CUTOVER.md
          test -f supabase/migrations/0001_initial_foundation.sql
          test -f supabase/migrations/0002_rls_policy_design.sql
          test -f supabase/migrations/0003_identity_membership_rls_baseline.sql
          test -f supabase/migrations/0004_learning_core.sql
          test -f supabase/migrations/0005_assessment_core.sql
          test -f supabase/migrations/0006_assessment_attempt_hardening.sql
          test -f supabase/migrations/0007_evidence_mastery.sql
          grep -q "mastery_history" supabase/migrations/0007_evidence_mastery.sql
          grep -q "skill_evidence_verification_consistency" supabase/migrations/0007_evidence_mastery.sql
          grep -q "assessment_attempt_lifecycle" supabase/migrations/0006_assessment_attempt_hardening.sql
          grep -q "assessment_items" supabase/migrations/0005_assessment_core.sql
          grep -q "assessment_answers" supabase/migrations/0005_assessment_core.sql
          grep -q "assessment_item_skill_targets" supabase/migrations/0005_assessment_core.sql
          grep -q "assessment_attempts_update_own" supabase/migrations/0005_assessment_core.sql
          grep -q "course_enrollments" supabase/migrations/0004_learning_core.sql
          grep -q "lesson_progress" supabase/migrations/0004_learning_core.sql
          grep -q "is_enrolled_in_lesson" supabase/migrations/0004_learning_core.sql
          grep -q "alter table public.course_enrollments enable row level security" supabase/migrations/0004_learning_core.sql
          grep -q "alter table public.lesson_progress enable row level security" supabase/migrations/0004_learning_core.sql
          test -f supabase/migrations/0011_skill_evidence_ingestion.sql
          test -f supabase/migrations/0012_practice_attempt_trusted_scoring.sql
          test -f supabase/migrations/0013_simulation_trusted_result.sql
          test -f supabase/migrations/0014_practice_simulation_evidence_workflows.sql
          test -f supabase/migrations/0015_foreign_key_performance_indexes.sql
          test -f supabase/migrations/0016_remove_duplicate_skill_evidence_index.sql
          grep -q "ingest_assessment_evidence" supabase/migrations/0011_skill_evidence_ingestion.sql
          grep -q "ingest_performance_evidence" supabase/migrations/0011_skill_evidence_ingestion.sql
          grep -q "finalize_practice_attempt" supabase/migrations/0014_practice_simulation_evidence_workflows.sql
          grep -q "ingest_practice_evidence" supabase/migrations/0014_practice_simulation_evidence_workflows.sql
          grep -q "finalize_simulation_run" supabase/migrations/0014_practice_simulation_evidence_workflows.sql
          grep -q "ingest_simulation_evidence" supabase/migrations/0014_practice_simulation_evidence_workflows.sql
          grep -q "service_role" supabase/migrations/0012_practice_attempt_trusted_scoring.sql
          grep -q "service_role" supabase/migrations/0013_simulation_trusted_result.sql
          echo "EDUNEXUS foundation, security baseline, and Neon cutover checks passed"
