name: EDUNEXUS AI Runtime Smoke Test

on:
  pull_request:
    paths:
      - ".github/workflows/edunexus-ai-runtime-smoke.yml"
      - "neon/migrations/**"
      - "neon/functions/edunexusai/**"
      - "tests/neon-frontend-e2e.mjs"
      - "web/knowledge-corpus.json"
      - "web/knowledge-sources.json"
      - "docs/KNOWLEDGE_CORPUS_CURRICULUM_V1.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/edunexus-ai-runtime-smoke.yml"
      - "web/knowledge-corpus.json"
      - "neon/functions/edunexusai/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source-grounded corpus and Frappe Books learning chunk
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const corpus = JSON.parse(await readFile("web/knowledge-corpus.json", "utf8"));
          if (corpus.version !== "edunexus-curated-knowledge-2026-10-16-v6" || !Array.isArray(corpus.chunks) || corpus.chunks.length < 57) {
            throw new Error("Repository corpus invalid: " + JSON.stringify({version:corpus.version,chunks:corpus.chunks?.length}));
          }
          if (!corpus.chunks.some(chunk => chunk.id === "EDU-FRAPPE-BOOKS-ACCOUNTING-LEARNING")) {
            throw new Error("Repository corpus missing Frappe Books accounting-learning chunk.");
          }
          console.log("REPOSITORY_CORPUS=PASS; version=" + corpus.version + "; chunks=" + corpus.chunks.length);
          if (process.env.GITHUB_EVENT_NAME !== "pull_request") {
            const response = await fetch("https://akvisomr-eng.github.io/EDUNEXUS-SOFTSKILL-HARDSKILL-/knowledge-corpus.json", {signal: AbortSignal.timeout(15000)});
            if (!response.ok) throw new Error("Published corpus HTTP " + response.status);
            const published = await response.json();
            if (published.version !== corpus.version || published.chunks?.length !== corpus.chunks.length ||
                !published.chunks.some(chunk => chunk.id === "EDU-FRAPPE-BOOKS-ACCOUNTING-LEARNING")) {
              throw new Error("Published corpus differs from repository: " + JSON.stringify({version:published.version,chunks:published.chunks?.length}));
            }
            console.log("PUBLISHED_CORPUS=PASS; version=" + published.version + "; chunks=" + published.chunks.length);
          } else {
            console.log("PUBLISHED_CORPUS=DEFERRED; PR checks repository artifact, live parity runs after merge/deploy.");
          }
          NODE
      - name: Verify preview and production runtime health, corpus parity, and fail-closed auth
        env:
          AI_URL: https://br-quiet-frost-azemctlk-edunexusai.compute.c-3.ap-southeast-1.aws.neon.tech
          PROD_AI_URL: https://br-bitter-king-azb11lde-edunexusai.compute.c-3.ap-southeast-1.aws.neon.tech
        run: |
          node --input-type=module <<'NODE'
          const expectedVersion = "edunexus-curated-knowledge-2026-10-16-v6";
          for (const [label, base] of [["PREVIEW", process.env.AI_URL], ["PRODUCTION", process.env.PROD_AI_URL]]) {
            const healthResponse = await fetch(base + "/health", {signal: AbortSignal.timeout(15000)});
            if (!healthResponse.ok) throw new Error(label + " AI health HTTP " + healthResponse.status);
            const health = await healthResponse.json();
            const safe = {
              service:health.service,status:health.status,authConfigured:health.authConfigured,
              persistentQuotaConfigured:health.persistentQuotaConfigured,
              knowledgeVersion:health.knowledgeVersion,knowledgeChunks:health.knowledgeChunks,
              inferenceConfigured:health.inferenceConfigured,inferenceProvider:health.inferenceProvider
            };
            console.log(label + "_AI_HEALTH=" + JSON.stringify(safe));
            if (health.service !== "edunexus-ai" || health.status !== "ok" || health.authConfigured !== true ||
                health.persistentQuotaConfigured !== true || health.knowledgeConfigured !== true ||
                health.knowledgeVersion !== expectedVersion || Number(health.knowledgeChunks) < 57 ||
                typeof health.inferenceConfigured !== "boolean") {
              throw new Error(label + " runtime configuration invalid: " + JSON.stringify(safe));
            }
            const unauth = await fetch(base + "/chat", {
              method:"POST",
              headers:{"Content-Type":"application/json","Origin":"https://akvisomr-eng.github.io"},
              body:JSON.stringify({message:"smoke test"}),
              signal:AbortSignal.timeout(15000)
            });
            if (unauth.status !== 401) throw new Error(label + " unauthenticated chat must return 401, got " + unauth.status);
            console.log(label + "_UNAUTHENTICATED_CHAT=PASS; HTTP 401");
          }
          NODE
