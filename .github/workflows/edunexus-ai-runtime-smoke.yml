name: EDUNEXUS AI Runtime Smoke Test

on:
  pull_request:
    paths:
      - ".github/workflows/edunexus-ai-runtime-smoke.yml"
      - "neon/migrations/**"
      - "neon/functions/edunexusai/**"
      - "tests/neon-frontend-e2e.mjs"
      - "web/knowledge-sources.json"
      - "web/knowledge-corpus.json"
      - "docs/KNOWLEDGE_CORPUS_CURRICULUM_V1.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/edunexus-ai-runtime-smoke.yml"
      - "web/knowledge-corpus.json"
      - "neon/functions/edunexusai/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployed Neon function health and fail-closed auth
        env:
          AI_URL: https://br-quiet-frost-azemctlk-edunexusai.compute.c-3.ap-southeast-1.aws.neon.tech
          PROD_AI_URL: https://br-bitter-king-azb11lde-edunexusai.compute.c-3.ap-southeast-1.aws.neon.tech
        run: |
          node --input-type=module <<'NODE'
          const corpusUrl = "https://akvisomr-eng.github.io/EDUNEXUS-SOFTSKILL-HARDSKILL-/knowledge-corpus.json";
          const corpusResponse = await fetch(corpusUrl, { signal: AbortSignal.timeout(15000) });
          if (!corpusResponse.ok) throw new Error("Published corpus HTTP " + corpusResponse.status);
          const corpus = await corpusResponse.json();
          if (!String(corpus.version).includes("v4") || !Array.isArray(corpus.chunks) || corpus.chunks.length < 54) {
            throw new Error("Published corpus invalid: " + JSON.stringify({ version: corpus.version, chunks: corpus.chunks?.length }));
          }
          console.log("PUBLISHED_CORPUS=PASS; version=" + corpus.version + "; chunks=" + corpus.chunks.length);
          const base = process.env.AI_URL;
          const health = await fetch(base + "/health", { signal: AbortSignal.timeout(15000) });
          if (!health.ok) throw new Error("AI health HTTP " + health.status);
          const body = await health.json();
          if (body.status !== "ok" || body.authConfigured !== true || body.knowledgeConfigured !== true || body.knowledgeChunks < 50) {
            throw new Error("AI health configuration invalid: " + JSON.stringify(body));
          }
          if (body.inferenceConfigured !== false || !String(body.knowledgeVersion).includes("v3")) {
            throw new Error("Expected honest retrieval-only mode with updated corpus and no provider key: " + JSON.stringify(body));
          }
          const unauth = await fetch(base + "/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Origin": "https://akvisomr-eng.github.io" },
            body: JSON.stringify({ message: "test" }),
            signal: AbortSignal.timeout(15000)
          });
          if (unauth.status !== 401) throw new Error("Unauthenticated chat must fail closed; got HTTP " + unauth.status);
          console.log("AI_RUNTIME_HEALTH_TEST_BRANCH=PASS; KNOWLEDGE_CHUNKS=" + body.knowledgeChunks + "; MODEL_MODE=RETRIEVAL_ONLY; UNAUTHENTICATED_CHAT=401");
          const prodHealthResponse = await fetch(process.env.PROD_AI_URL + "/health", { signal: AbortSignal.timeout(15000) });
          if (!prodHealthResponse.ok) throw new Error("Production AI health HTTP " + prodHealthResponse.status);
          const prodHealth = await prodHealthResponse.json();
          if (prodHealth.status !== "ok" || prodHealth.authConfigured !== true || prodHealth.knowledgeConfigured !== true || prodHealth.knowledgeChunks < 51 || !String(prodHealth.knowledgeVersion).includes("v3")) {
            throw new Error("Production AI runtime/corpus invalid: " + JSON.stringify(prodHealth));
          }
          console.log("AI_RUNTIME_HEALTH_PRODUCTION=PASS; version=" + prodHealth.knowledgeVersion + "; chunks=" + prodHealth.knowledgeChunks + "; inferenceConfigured=" + prodHealth.inferenceConfigured);
          NODE
