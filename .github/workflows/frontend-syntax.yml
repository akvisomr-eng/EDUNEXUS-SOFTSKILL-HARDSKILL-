name: EDUNEXUS Frontend Syntax
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse module script from HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text()
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          assert len(scripts) == 1, f"expected one module script, found {len(scripts)}"
          Path("/tmp/edunexus-frontend-check.mjs").write_text(scripts[0])
          for marker in ("goalForm", "loadLearning", "loadDevelopment", "openLesson", "completeLesson", "Sumber dan bacaan lanjutan", "Catatan sumber dan lisensi", "knowledgeLibrary", "loadKnowledgeSources", "loadCatalog", "ensure_my_profile"):
              assert marker in html, f"missing expected feature marker: {marker}"
          for migration in ("neon/migrations/0005_initial_curriculum_seed.sql", "neon/migrations/0006_curated_open_curriculum.sql", "neon/migrations/0006_curated_knowledge_curriculum_v2.sql", "neon/migrations/0007_knowledge_source_registry.sql", "neon/migrations/0008_knowledge_lexical_search.sql", "supabase/migrations/20261014140000_initial_curriculum_seed.sql", "supabase/migrations/20261014150000_curated_open_curriculum.sql", "supabase/migrations/20261014170000_curated_knowledge_curriculum_v2.sql", "supabase/migrations/20261014180000_knowledge_source_registry.sql", "supabase/migrations/20261014190000_knowledge_lexical_search.sql"):
              assert Path(migration).exists(), f"missing migration: {migration}"
          assert Path("docs/CURATED_OPEN_CURRICULUM.md").exists()
          assert Path("docs/EDUNEXUS_CURATED_KNOWLEDGE_CORPUS_V2.md").exists()
          assert Path("web/knowledge-sources.json").exists()
          print("Frontend module, source attribution UI, and curriculum migrations present.")
          PY
          node --check /tmp/edunexus-frontend-check.mjs
