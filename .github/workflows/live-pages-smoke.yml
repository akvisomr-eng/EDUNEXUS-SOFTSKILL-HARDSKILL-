name: EDUNEXUS Live Pages Smoke Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/live-pages-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/live-pages-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify published EDUNEXUS frontend
        run: |
          set -euo pipefail
          URL="https://akvisomr-eng.github.io/EDUNEXUS-SOFTSKILL-HARDSKILL-/"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 15 "$URL" -o live.html; then break; fi
            sleep 3
          done
          grep -q "EDUNEXUS" live.html
          curl --fail --silent --show-error --max-time 15 "${URL}app/" -o app.html
          grep -q "EDUNEXUS MULTI-AGENT AI" app.html
          grep -q "Mode basis pengetahuan aktif" app.html
          grep -q "knowledgeVersion" app.html
          curl --fail --silent --show-error --max-time 15 "${URL}app/knowledge-sources.json" -o knowledge-sources.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("knowledge-sources.json").read_text())
          sources = data.get("sources", [])
          assert len(sources) >= 18, f"expected at least 18 curated sources, got {len(sources)}"
          assert all(item.get("url", "").startswith("https://") for item in sources)
          print(f"Published knowledge registry verified: {len(sources)} HTTPS sources")
          PY
          echo "Published EDUNEXUS Pages contains the source-grounded assistant UI and curated source registry."
