name: Neon Browser Smoke Test

on:
  push:
    branches: ["feat/neon-production-cutover"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve disposable Neon smoke page
        run: |
          python3 -m http.server 4173 --directory web > /tmp/edunexus-smoke-http.log 2>&1 &
          echo $! > /tmp/edunexus-smoke-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/neon-cutover-smoke.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/edunexus-smoke-http.log
          exit 1
      - name: Test Neon Auth and Data API with a disposable account
        run: node tests/neon-browser-smoke.mjs
