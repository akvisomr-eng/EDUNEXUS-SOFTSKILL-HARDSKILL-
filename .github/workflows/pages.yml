name: Deploy EDUNEXUS Web

# Safe trigger refresh after initial Pages publication setup.

on:
  push:
    branches: ["main"]
    paths: ["web/**",".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web app
        run: |
          test -f web/index.html
          grep -q "@neondatabase/auth@0.5.0-beta" web/index.html
          grep -q "NEON_AUTH_URL" web/index.html
          grep -q "DATA_API_URL" web/index.html
          grep -q "ensure_my_profile" web/index.html
          grep -q "finalize_my_practice_attempt" web/index.html
          grep -q "practice_scenarios" web/index.html
          grep -q "Mulai praktik" web/index.html
          ! grep -q "SUPABASE_URL" web/index.html
          ! grep -q "SUPABASE_KEY" web/index.html
          ! grep -q "supabase.co" web/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path("web/index.html").read_text()
          assert html.count('<script type="module">') == 1
          assert "</html>" in html
          assert 'id="knowledgeNotes"' in html
          import json
          corpus=json.loads(Path("web/knowledge-sources.json").read_text())
          canonical=[s for s in corpus.get("sources",[]) if not s.get("isKnowledgeChunk")]
          assert len(canonical) >= 28, len(canonical)
          assert len(corpus.get("knowledgeChunks",[])) >= 18
          assert corpus.get("knowledgeStats",{}).get("fullTextDocumentsDownloaded") == 0
          assert corpus.get("knowledgeStats",{}).get("embeddingsCreated") == 0
          print(f"EDUNEXUS Neon frontend + knowledge corpus validation passed: {len(canonical)} sources, {len(corpus['knowledgeChunks'])} editorial notes")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages and Neon AI runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          AI_URL: https://br-bitter-king-azb11lde-edunexusai.compute.c-3.ap-southeast-1.aws.neon.tech
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/edunexus-live.html; then break; fi
            sleep 3
          done
          grep -q "EDUNEXUS" /tmp/edunexus-live.html
          grep -q "EDUNEXUS MULTI-AGENT AI" /tmp/edunexus-live.html
          curl --fail --silent --show-error "$AI_URL/health" -o /tmp/edunexus-ai-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/edunexus-ai-health.json").read_text())
          assert data.get("service") == "edunexus-ai", data
          assert data.get("status") == "ok", data
          assert data.get("authConfigured") is True, data
          print("EDUNEXUS live Pages and authenticated AI runtime health: PASS")
          if data.get("inferenceConfigured") is not True:
              print("NOTICE: model inference is not configured; add MODEL_API_KEY as a server-side Neon Function secret.")
          PY
