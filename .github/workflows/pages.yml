name: Deploy EDUNEXUS Web

on:
  push:
    branches: ["main"]
    paths: ["web/**",".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web app
        run: |
          set -euo pipefail
          test -f web/index.html
          grep -q "@neondatabase/auth@0.5.0-beta" web/index.html
          grep -q "NEON_AUTH_URL" web/index.html
          grep -q "DATA_API_URL" web/index.html
          grep -q "ensure_my_profile" web/index.html
          grep -q "finalize_my_practice_attempt" web/index.html
          grep -q "practice_scenarios" web/index.html
          grep -q "Mulai praktik" web/index.html
          ! grep -q "SUPABASE_URL" web/index.html
          ! grep -q "SUPABASE_KEY" web/index.html
          ! grep -q "supabase.co" web/index.html
          python - <<'PY'
          from pathlib import Path
          import json
          from urllib.parse import urlparse

          html = Path("web/index.html").read_text()
          assert html.count('<script type="module">') == 1, "Expected one module entrypoint"
          assert "</html>" in html, "HTML document is incomplete"
          assert 'id="knowledgeNotes"' in html, "Knowledge notes UI mount is missing"
          assert 'id="knowledgeSourcesList"' in html, "Knowledge source UI mount is missing"
          assert 'id="aiChatForm"' in html, "AI chat UI is missing"
          assert 'id="aiHealth"' in html, "AI runtime health UI is missing"
          assert 'aria-label="Navigasi utama EDUNEXUS"' in html, "Dashboard navigation is missing"
          assert 'class="sidebar-nav"' in html, "Dashboard navigation groups are missing"
          assert 'document.body.classList.add("dashboard")' in html, "Dashboard mode activation is missing"
          assert "function setupIndependentModules()" in html, "Independent module router is missing"
          assert 'className="module-view"' in html, "Independent module view containers are missing"
          assert "activateModule(navMap[link.getAttribute(\"href\").slice(1)]" in html, "Menu-to-module routing is missing"
          assert "view.dataset.module=def.key" in html, "Module view keys are not assigned"
          for module in ["overview", "courses", "practice", "goals", "ai", "knowledge", "history"]:
              assert f'key:"{module}"' in html, f"Missing independent module definition: {module}"
          for target in ["welcome", "coursesList", "scenarios", "goalForm", "aiCoach", "knowledgeLibrary", "history"]:
              assert f'href="#{target}"' in html, f"Missing dashboard navigation target: {target}"
          assert Path("web/THIRD-PARTY-NOTICES.md").exists(), "Third-party attribution notice is missing"

          registry = json.loads(Path("web/knowledge-sources.json").read_text())
          sources = [s for s in registry.get("sources", []) if not s.get("isKnowledgeChunk")]
          notes = registry.get("knowledgeChunks", [])
          assert len(sources) >= 28, f"Expected at least 28 canonical sources; got {len(sources)}"
          assert len(notes) >= 18, f"Expected at least 18 editorial knowledge notes; got {len(notes)}"
          assert registry.get("knowledgeStats", {}).get("fullTextDocumentsDownloaded") == 0
          assert registry.get("knowledgeStats", {}).get("embeddingsCreated") == 0

          source_ids = [s.get("id") for s in sources]
          note_ids = [n.get("id") for n in notes]
          assert all(source_ids), "Every canonical source needs an ID"
          assert len(source_ids) == len(set(source_ids)), "Duplicate canonical source IDs"
          assert all(note_ids), "Every knowledge note needs an ID"
          assert len(note_ids) == len(set(note_ids)), "Duplicate knowledge note IDs"
          allowed_sources = set(source_ids)
          for source in sources:
              parsed = urlparse(source.get("url", ""))
              assert parsed.scheme == "https" and parsed.netloc, f"Invalid source URL: {source.get('id')}"
              assert source.get("title") and source.get("publisher") and source.get("license"), f"Missing source metadata: {source.get('id')}"
          for note in notes:
              assert note.get("sourceId") in allowed_sources, f"Unresolved provenance for note: {note.get('id')}"
              assert note.get("title") and note.get("text") and note.get("domain"), f"Incomplete knowledge note: {note.get('id')}"
              assert note.get("agentRoles"), f"No agent mapping for note: {note.get('id')}"
          print(f"EDUNEXUS corpus validated: {len(sources)} sources, {len(notes)} original notes; provenance and metadata checks passed.")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages and Neon AI runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          AI_URL: https://br-bitter-king-azb11lde-edunexusai.compute.c-3.ap-southeast-1.aws.neon.tech
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$PAGE_URL" -o /tmp/edunexus-live.html; then break; fi
            sleep 3
          done
          grep -q "EDUNEXUS" /tmp/edunexus-live.html
          grep -q "EDUNEXUS MULTI-AGENT AI" /tmp/edunexus-live.html
          curl --fail --silent --show-error "$AI_URL/health" -o /tmp/edunexus-ai-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/edunexus-ai-health.json").read_text())
          assert data.get("service") == "edunexus-ai", data
          assert data.get("status") == "ok", data
          assert data.get("authConfigured") is True, data
          print("EDUNEXUS live Pages and authenticated AI runtime health: PASS")
          if data.get("inferenceConfigured") is not True:
              print("NOTICE: model inference is not configured; add MODEL_API_KEY as a server-side Neon Function secret.")
          PY
