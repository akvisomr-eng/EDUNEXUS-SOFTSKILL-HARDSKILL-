name: Deploy EDUNEXUS Web

# Safe trigger refresh after initial Pages publication setup.

on:
  push:
    branches: ["main"]
    paths: ["web/**",".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web app
        run: |
          test -f web/index.html
          grep -q "SUPABASE_URL" web/index.html
          grep -q "SUPABASE_KEY" web/index.html
          grep -q "edunexus-health" web/index.html
          grep -q "practice_scenarios" web/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path("web/index.html").read_text()
          assert html.count("<script>") == 1
          assert "</html>" in html
          print("EDUNEXUS web smoke validation passed")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
